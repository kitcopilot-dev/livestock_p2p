name: CI + Deploy to exe.dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  # ── CI: typecheck + test ────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @livestock/db generate
        env:
          # prisma.config.ts requires DATABASE_URL at load time; generate
          # doesn't connect to the DB, so a dummy value suffices.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # ── Deploy: pull and restart on exe.dev self-hosted runner ─────────────
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux]
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Pull latest
        run: git fetch origin main && git reset --hard origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        run: cd packages/db && pnpm prisma migrate deploy && pnpm prisma generate

      - name: Build
        run: pnpm --filter @livestock/api build

      - name: Restart app
        run: |
          pkill -f "next start" 2>/dev/null || true
          sleep 2
          cd apps/api && nohup npx next start -p 3000 -H 0.0.0.0 > /tmp/nextapp.log 2>&1 &
          sleep 5
          curl -sf http://localhost:3000/ > /dev/null && echo "✅ App is running" || echo "❌ App failed to start"
