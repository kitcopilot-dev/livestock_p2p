name: CI + Deploy to exe.dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  # ── CI: typecheck + test ────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livestock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests run against the service Postgres.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/livestock_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @livestock/db generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Apply migrations
        run: cd packages/db && pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test
        env:
          # Dry-run tests construct StripeProvider.fromEnv, which validates
          # presence even though PAYMENTS_DRY_RUN means no real calls.
          PAYMENTS_DRY_RUN: "true"
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_PLATFORM_ACCOUNT_ID: acct_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy

  # ── Deploy: pull and restart on exe.dev self-hosted runner ─────────────
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux]
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Pull latest
        run: git fetch origin main && git reset --hard origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        run: cd packages/db && pnpm prisma migrate deploy && pnpm prisma generate

      - name: Build
        run: pnpm --filter @livestock/api build

      - name: Restart app
        run: |
          pkill -f "next start" 2>/dev/null || true
          sleep 2
          cd apps/api && nohup npx next start -p 3000 -H 0.0.0.0 > /tmp/nextapp.log 2>&1 &
          sleep 5
          curl -sf http://localhost:3000/ > /dev/null && echo "✅ App is running" || echo "❌ App failed to start"
